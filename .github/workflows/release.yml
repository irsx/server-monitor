name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish Linux binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check installer
        run: |
          bash -n scripts/install.sh
          python3 -m unittest discover -s scripts/tests -v

      - name: Build Linux binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -mod=readonly -trimpath -ldflags='-s -w' \
              -o "dist/service-health-monitor-linux-$arch" ./cmd/monitor
          done

      - name: Package installer files
        run: |
          cp scripts/install.sh dist/install.sh
          cp .env.example dist/server-monitor.env.example
          cp deploy/server-monitor.service dist/server-monitor.service

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum service-health-monitor-linux-* install.sh server-monitor.env.example server-monitor.service > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Rerun workflow: update assets on the existing release.
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
